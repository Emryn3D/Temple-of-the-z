<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Legend of Now – Temple of Z</title>
  <style>
    :root { --fg:#fff; --bg:#0b0b0b; --glass:#ffffff2a; --accent:#f4d444; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    #hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;font-weight:700;text-shadow:0 1px 2px #0008;white-space:nowrap}
    #toolbar{position:fixed;top:8px;left:8px;display:flex;gap:8px;z-index:30}
    .btn{border:0;border-radius:10px;padding:8px 12px;background:var(--glass);color:#fff;font-weight:700;backdrop-filter:blur(4px)}
    .btn:disabled{opacity:0.5}
    #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;backdrop-filter:blur(2px);z-index:40}
    #overlay .card{background:#111c;border:1px solid #ffffff22;border-radius:16px;padding:20px;min-width:min(92vw,560px);display:flex;flex-direction:column;gap:10px;align-items:center}
    #controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:35}
    #controls button{width:64px;height:64px;border:0;border-radius:12px;background:var(--glass);color:#fff;font-size:22px;touch-action:none}
    #powerwrap{position:fixed;top:34px;left:50%;transform:translateX(-50%);width:180px;height:7px;border-radius:4px;background:#ffffff22;z-index:20;overflow:hidden}
    #powerbar{height:100%;width:100%;background:var(--accent);border-radius:4px;transition:background 0.2s}
    #subtitle{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);max-width:min(92vw,640px);text-align:center;font-weight:600;font-size:17px;color:#ffe9b0;text-shadow:0 1px 3px #000c;background:#0008;border-radius:10px;padding:8px 14px;z-index:25;opacity:0;transition:opacity 0.4s;pointer-events:none}
    #hint{position:fixed;top:48px;left:50%;transform:translateX(-50%);font-size:12px;opacity:0.65;z-index:20}
  </style>
  <script type="importmap">{"imports":{"three":"./lib/three/three.module.js","three/addons/":"./lib/three/addons/"}}</script>
</head>
<body>
<div id="hud"></div>
<div id="powerwrap"><div id="powerbar"></div></div>
<div id="hint">WASD/arrows move · Q/E turn · Z fire · X/Shift = Now-shift</div>
<div id="toolbar"><button id="btnPause" class="btn">⏸</button><button id="btnResume" class="btn">⏵</button><button id="btnRestart" class="btn">⟲</button></div>
<div id="subtitle"></div>
<div id="controls"><button id="mvL">◀︎</button><button id="mvB">▼</button><button id="mvF">▲</button><button id="mvR">▶︎</button><button id="btnFire">Z</button><button id="btnShift">◷</button></div>
<div id="overlay"><div class="card"><h1 id="ovTitle">Temple of Z</h1><p id="ovText">Awakening the Now…</p><button id="btnPlay" class="btn" disabled>Loading…</button></div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
